<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plateload</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plateload — a gym log with a built-in exercise library, workout builder, streaks, records, running and calorie tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: sticky header + scrollable tab strip, one centered 980px column of panels; plate colours code muscle regions. */
:root{
  --bg:#e8ecf0; --surface:#f8fafc; --sunk:#dde3e9; --ink:#131b24; --muted:#56636f; --line:#cbd3db;
  --accent:#1d4ed8; --accent-ink:#ffffff; --accent-soft:#dbe3f8;
  --red:#c63a2b; --blue:#1d4ed8; --yellow:#d4960a; --green:#2a8549; --gray:#77838f; --plate-ink:#131b24;
  --good:#2a8549; --bad:#c63a2b;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1217; --surface:#151c24; --sunk:#0a0e12; --ink:#e5eaef; --muted:#8f9ba7; --line:#26303b;
  --accent:#6d8dff; --accent-ink:#0a1020; --accent-soft:#1b2648;
  --red:#ee5d4d; --blue:#6d8dff; --yellow:#f0b52d; --green:#4cb56f; --gray:#8a95a1; --plate-ink:#e5eaef;
  --good:#4cb56f; --bad:#ee5d4d; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0d1217; --surface:#151c24; --sunk:#0a0e12; --ink:#e5eaef; --muted:#8f9ba7; --line:#26303b;
  --accent:#6d8dff; --accent-ink:#0a1020; --accent-soft:#1b2648;
  --red:#ee5d4d; --blue:#6d8dff; --yellow:#f0b52d; --green:#4cb56f; --gray:#8a95a1; --plate-ink:#e5eaef;
  --good:#4cb56f; --bad:#ee5d4d; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px 4px}
.logo{font:900 26px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.logo i{display:inline-flex;gap:2px;align-items:center}
.logo i b{display:block;width:6px;border-radius:2px}
.save-state{font-size:12px;color:var(--muted);text-align:right}
.save-state.warn{color:var(--yellow)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:none;border:0;background:none;padding:10px 12px 12px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.tabs button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-left:6px;vertical-align:2px}

main{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0}
.panel.flat{background:none;border:0;padding:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.h-display{font:800 34px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.h2{font:800 22px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.stack{display:grid;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:38px;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px}
.icon-btn{border:0;background:none;cursor:pointer;width:32px;height:32px;border-radius:6px;color:var(--muted);font-size:16px;display:inline-grid;place-items:center}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}

input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 10px;min-height:38px;width:100%;min-width:0}
textarea{font-family:var(--f-mono);font-size:12px;min-height:220px}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12px;font-weight:600;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .pd{width:9px;height:9px;border-radius:50%;background:var(--c,var(--gray));flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.tag.m::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag.m{color:var(--ink)}
.tag.custom{background:var(--accent-soft);color:var(--accent)}
.c-red{--c:var(--red)} .c-blue{--c:var(--blue)} .c-yellow{--c:var(--yellow)} .c-green{--c:var(--green)} .c-ink{--c:var(--plate-ink)} .c-gray{--c:var(--gray)}

/* weekly goal as plates loaded on a sleeve */
.sleeve{display:flex;align-items:center;min-height:96px;overflow-x:auto;padding-block:4px}
.sleeve .bar{height:12px;width:28px;background:var(--gray);border-radius:2px 0 0 2px;flex:none}
.sleeve .collar{width:10px;height:34px;background:var(--gray);border-radius:3px;flex:none}
.sleeve .plates{display:flex;gap:3px;align-items:center;padding-inline:3px}
.plate{width:22px;height:86px;border-radius:5px;flex:none;background:var(--c);display:grid;place-items:center;color:#fff;font:800 11px/1 var(--f-display);writing-mode:vertical-rl;letter-spacing:.06em}
.plate.empty{background:none;border:2px dashed var(--line);color:var(--muted)}
.sleeve .end{height:12px;flex:1;min-width:20px;background:var(--gray);border-radius:0 2px 2px 0}
@media (prefers-reduced-motion:no-preference){.plate:not(.empty){animation:load .4s ease-out both}}
@keyframes load{from{transform:translateX(18px)}to{transform:none}}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{display:grid;justify-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:600}
.week span{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px}
.week .on span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.week .today{color:var(--ink)}
.week .today span{border-color:var(--ink)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{display:grid;gap:2px}
.stat b{font:800 34px/1 var(--f-display)}
.stat b small{font-size:16px;font-weight:700;margin-left:3px;color:var(--muted)}

.kcal{display:grid;gap:0}
.kcal div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.kcal div:last-child{border-bottom:0;font-weight:700}
.kcal .total b{font:800 30px/1 var(--f-display)}

.list{display:grid;gap:0}
.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item .main{min-width:0;display:grid;gap:4px}
.item .name{font-weight:600}
.item .acts{display:flex;gap:4px;flex:none;align-items:center}
.group-h{padding:14px 0 4px;display:flex;align-items:center;gap:8px}

.card{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;background:var(--surface);min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}

/* active session */
.session{border:2px solid var(--accent)}
.ex{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;background:var(--bg)}
.ex-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ex-h .name{font-weight:700;font-size:16px}
.sets{width:100%;border-collapse:collapse}
.sets th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:2px 4px;font-weight:700}
.sets td{padding:3px 4px}
.sets td:first-child{width:28px;font-family:var(--f-mono);color:var(--muted);text-align:center}
.sets input[type=number]{min-height:36px;text-align:center;font-family:var(--f-mono)}
.sets tr.done input[type=number]{border-color:var(--good)}
.tick{appearance:none;width:30px;height:30px;border:2px solid var(--line);border-radius:7px;cursor:pointer;display:grid;place-items:center;margin:0}
.tick:checked{background:var(--good);border-color:var(--good)}
.tick:checked::after{content:"";width:9px;height:15px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-2px)}

.tbl-wrap{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:14px}
table.data th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.data td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
table.data tbody tr{cursor:pointer}
table.data tbody tr:hover{background:var(--sunk)}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent);opacity:.55}
.chart .bar.cur{opacity:1}
.chart .val{fill:var(--ink);font-weight:700}
.spark polyline{fill:none;stroke:var(--accent);stroke-width:2}
.spark circle{fill:var(--accent)}

.empty{padding:22px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}
.pr{display:flex;gap:8px;align-items:center;padding:6px 0}
.pr .badge{font:800 12px/1 var(--f-display);letter-spacing:.06em;background:var(--yellow);color:#1b1300;padding:4px 7px;border-radius:4px}

.scrim{position:fixed;inset:0;background:rgba(5,10,15,.55);z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:14px;width:min(620px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:14px;border:1px solid var(--line)}
.sheet h3{font:800 24px/1.1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.pick-list{max-height:52vh;overflow:auto}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.note{font-size:12px;color:var(--muted);max-width:68ch}
.by{font-size:12px;color:var(--muted)}
.by b{color:var(--ink);font-weight:600}

/* planner */
.planner{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.pday{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);padding:10px;display:grid;gap:8px;align-content:start;min-width:0;min-height:150px}
.pday.today{border:2px solid var(--accent)}
.pday.past{opacity:.82}
.pday-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.pday-h b{font:800 18px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.pday-h span{font-size:12px;color:var(--muted)}
.pent{border-radius:7px;background:var(--surface);border:1px solid var(--line);padding:7px 8px;display:grid;gap:4px;font-size:13px;position:relative;min-width:0}
.pent .t{font-weight:700;padding-right:22px;overflow-wrap:anywhere}
.pent .x{position:absolute;top:2px;right:2px;width:24px;height:24px}
.pent.done{border-color:var(--good)}
.pent.done .t::before{content:"✓ ";color:var(--good)}
.pent.rest{background:none;border-style:dashed;color:var(--muted)}
.pent .stripe{display:flex;gap:2px}
.pent .stripe i{height:4px;flex:1;border-radius:2px;background:var(--c)}
.pday .add{border:1px dashed var(--line);background:none;border-radius:7px;padding:6px;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer}
.pday .add:hover{color:var(--ink);border-color:var(--muted)}
@media (max-width:860px){ .planner{grid-template-columns:1fr} .pday{min-height:0} }
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav strong{min-width:150px;text-align:center}

/* share */
.qr-box{display:grid;justify-items:center;gap:10px;padding:16px;border-radius:var(--r);background:#fff;color:#111}
.qr-box canvas{width:min(300px,100%);height:auto;image-rendering:pixelated;display:block}
.qr-box p{font-size:12px;color:#444;text-align:center;max-width:40ch}
.qr-note{font-size:13px;color:var(--muted);padding:12px;border:1px dashed var(--line);border-radius:var(--r)}
.code-out{font-family:var(--f-mono);font-size:11px;min-height:70px;word-break:break-all}
.checks{display:grid;gap:0}
.checks label{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;min-width:0}
.checks label:last-child{border-bottom:0}
.checks input{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.checks .main{display:grid;gap:2px;min-width:0}
.scan-video{width:100%;max-height:50vh;border-radius:var(--r);background:#000;object-fit:cover}
.lic{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
@media (max-width:560px){ .h-display{font-size:28px} .panel{padding:14px} .sets th:nth-child(5),.sets td:nth-child(5){width:34px} }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo"><i aria-hidden="true"><b style="height:22px;background:var(--red)"></b><b style="height:22px;background:var(--blue)"></b><b style="height:18px;background:var(--yellow)"></b><b style="height:14px;background:var(--green)"></b></i>Plateload</div>
      <div class="save-state" id="save-state"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main id="view"></main>
<div id="modal" class="scrim" hidden><div class="sheet" role="dialog" aria-modal="true" id="modal-body"></div></div>
<div id="toast" role="status" hidden></div>

<script>
"use strict";
/* ================= Base exercise library =================
   name | primary muscle | secondary | equipment | pattern | category | compound(1/0) | kind (w weighted, b bodyweight, t timed hold, c cardio) | MET */
const RAW = `
Barbell Bench Press|Chest|Triceps,Shoulders|Barbell|Push|Strength|1
Incline Barbell Bench Press|Chest|Shoulders,Triceps|Barbell|Push|Strength|1

Dumbbell Bench Press|Chest|Triceps,Shoulders|Dumbbell|Push|Strength|1
Incline Dumbbell Press|Chest|Shoulders,Triceps|Dumbbell|Push|Strength|1
Dumbbell Fly|Chest||Dumbbell|Push|Strength|0
Incline Dumbbell Fly|Chest|Shoulders|Dumbbell|Push|Strength|0
Machine Chest Press|Chest|Triceps|Machine|Push|Strength|1
Pec Deck|Chest||Machine|Push|Strength|0
Cable Crossover|Chest||Cable|Push|Strength|0
Low-to-High Cable Fly|Chest|Shoulders|Cable|Push|Strength|0
Smith Machine Incline Press|Chest|Shoulders,Triceps|Smith Machine|Push|Strength|1
Push-Up|Chest|Triceps,Core|Bodyweight|Push|Bodyweight|1
Chest Dip|Chest|Triceps,Shoulders|Bodyweight|Push|Bodyweight|1
Dumbbell Pullover|Chest|Back|Dumbbell|Push|Strength|0
Deadlift|Back|Hamstrings,Glutes,Forearms|Barbell|Pull|Strength|1
Barbell Row|Back|Biceps|Barbell|Pull|Strength|1
Pendlay Row|Back|Biceps|Barbell|Pull|Strength|1
T-Bar Row|Back|Biceps|Machine|Pull|Strength|1
One-Arm Dumbbell Row|Back|Biceps|Dumbbell|Pull|Strength|1
Chest-Supported Dumbbell Row|Back|Biceps,Shoulders|Dumbbell|Pull|Strength|1
Pull-Up|Back|Biceps|Bodyweight|Pull|Bodyweight|1
Chin-Up|Back|Biceps|Bodyweight|Pull|Bodyweight|1
Lat Pulldown|Back|Biceps|Cable|Pull|Strength|1
Close-Grip Lat Pulldown|Back|Biceps|Cable|Pull|Strength|1
Seated Cable Row|Back|Biceps|Cable|Pull|Strength|1
Straight-Arm Pulldown|Back||Cable|Pull|Strength|0
Machine Row|Back|Biceps|Machine|Pull|Strength|1
Assisted Pull-Up|Back|Biceps|Machine|Pull|Strength|1
Inverted Row|Back|Biceps|Bodyweight|Pull|Bodyweight|1
Rack Pull|Back|Glutes,Forearms|Barbell|Pull|Strength|1
Back Extension|Back|Glutes,Hamstrings|Bodyweight|Pull|Bodyweight|0
Barbell Shrug|Back|Forearms|Barbell|Pull|Strength|0
Dumbbell Shrug|Back|Forearms|Dumbbell|Pull|Strength|0
Overhead Press|Shoulders|Triceps|Barbell|Push|Strength|1
Seated Dumbbell Shoulder Press|Shoulders|Triceps|Dumbbell|Push|Strength|1
Arnold Press|Shoulders|Triceps|Dumbbell|Push|Strength|1
Machine Shoulder Press|Shoulders|Triceps|Machine|Push|Strength|1
Push Press|Shoulders|Triceps,Quads|Barbell|Push|Strength|1
Landmine Press|Shoulders|Chest,Triceps|Barbell|Push|Strength|1
Pike Push-Up|Shoulders|Triceps|Bodyweight|Push|Bodyweight|1
Dumbbell Lateral Raise|Shoulders||Dumbbell|Push|Strength|0
Cable Lateral Raise|Shoulders||Cable|Push|Strength|0
Machine Lateral Raise|Shoulders||Machine|Push|Strength|0
Dumbbell Front Raise|Shoulders||Dumbbell|Push|Strength|0
Rear Delt Fly|Shoulders|Back|Dumbbell|Pull|Strength|0
Reverse Pec Deck|Shoulders|Back|Machine|Pull|Strength|0
Face Pull|Shoulders|Back|Cable|Pull|Strength|0
Barbell Upright Row|Shoulders|Back,Biceps|Barbell|Pull|Strength|1
Band Pull-Apart|Shoulders|Back|Band|Pull|Strength|0
Barbell Curl|Biceps|Forearms|Barbell|Pull|Strength|0
EZ-Bar Curl|Biceps|Forearms|EZ Bar|Pull|Strength|0

      if (kg > 0 && reps > 0 && reps <= 12) { const v = e1rm(kg,reps); if (v > top) { top = v; topSet = {kg,reps}; } if (!r.best1 || v > r.best1.kg + 1e-6) r.best1 = {kg:v, date:w.date}; }
      if (reps > 0 && (!r.maxReps || reps > r.maxReps.reps)) r.maxReps = {reps, kg, date:w.date};
    }
    if (vol > 0 && (!r.bestVol || vol > r.bestVol.kg + 1e-6)) r.bestVol = {kg:vol, date:w.date};
    r.sessions.push({date:w.date, e1:top, vol, topSet, sets:it.sets});
  }
  for (const m of maxes) {
    const r = get(m.exId), kg = num(m.kg), reps = Math.max(1, num(m.reps));
    if (!r.maxW || kg > r.maxW.kg + 1e-6) r.maxW = {kg, reps, date:m.date, manual:true};
    const v = e1rm(kg, reps); if (!r.best1 || v > r.best1.kg + 1e-6) r.best1 = {kg:v, date:m.date, manual:true};
  }
  return R;
}

  }

}

/* ================= TRAIN ================= */
const SCHEMES = {strength:{label:'Strength 5×5', sets:5, reps:5, isoSets:3, isoReps:8}, hyp:{label:'Hypertrophy 3×10', sets:3, reps:10, isoSets:3, isoReps:12}, endure:{label:'Endurance 3×15', sets:3, reps:15, isoSets:3, isoReps:20}};
const PRESETS = {Push:['Chest','Shoulders','Triceps'], Pull:['Back','Biceps'], Legs:['Quads','Hamstrings','Glutes','Calves'], Upper:['Chest','Back','Shoulders','Biceps','Triceps'], 'Full body':['Chest','Back','Quads','Hamstrings','Core']};
const GEN = {groups:new Set(['Chest','Triceps']), equip:new Set(EQUIP), per:2, scheme:'hyp', result:[]};
const shuffle = a => { a = [...a]; for (let i=a.length-1;i>0;i--){ const j = Math.random()*(i+1)|0; [a[i],a[j]] = [a[j],a[i]]; } return a; };
function poolFor(group){ return allEx().filter(e => e.muscle===group && (GEN.equip.has(e.equipment) || (!EQUIP.includes(e.equipment) && GEN.equip.has('Other')))); }
function genItem(e){
  const sc = SCHEMES[GEN.scheme];
  if (e.kind==='c') return {exId:e.id, sets:1, min:15};
  if (e.kind==='t') return {exId:e.id, sets:3, reps:45};
  return e.compound ? {exId:e.id, sets:sc.sets, reps:sc.reps} : {exId:e.id, sets:sc.isoSets, reps:sc.isoReps};
}
function generate(){
  const groups = MUSCLES.filter(m=>GEN.groups.has(m));
  if (!groups.length) { toast('Pick at least one muscle group'); return; }
  const out = [], used = new Set(), short = [];
  for (const g of groups) {
    const pool = poolFor(g); const comp = shuffle(pool.filter(e=>e.compound)), iso = shuffle(pool.filter(e=>!e.compound));
    const order = []; while (comp.length || iso.length) { if (comp.length) order.push(comp.shift()); if (iso.length) order.push(iso.shift()); }
    let n = 0; for (const e of order) { if (n >= GEN.per) break; if (used.has(e.id)) continue; used.add(e.id); out.push(genItem(e)); n++; }
    if (n < GEN.per) short.push(g);
  }
  // compounds first across the whole session
  out.sort((a,b) => (getEx(b.exId).compound?1:0) - (getEx(a.exId).compound?1:0));
  GEN.result = out;
  if (short.length) toast('Not enough exercises for ' + short.join(', ') + ' with that equipment');
  renderTrain();
}
function rerollGen(i){
  const cur = getEx(GEN.result[i].exId); const used = new Set(GEN.result.map(r=>r.exId));
  const opts = shuffle(poolFor(cur.muscle).filter(e=>!used.has(e.id)));
  if (!opts.length) { toast('No other ' + cur.muscle.toLowerCase() + ' exercises match your equipment'); return; }
  const pref = opts.find(e=>e.compound===cur.compound) || opts[0];
  GEN.result[i] = genItem(pref); renderTrain();
}
function routineCard(r){

function newSet(e, prev, target){
  if (e.kind==='c') return {min:'', dist:'', done:false};
  return {w: prev ?? '', r:'', done:false};
}
function itemFromPlan(p){
  const e = getEx(p.exId), last = lastSession(p.exId);
  const lastTop = last && last.sets.length ? last.sets.reduce((a,s)=> num(s.w) >= num(a.w) ? s : a, last.sets[0]) : null;
  const prevW = e.kind==='w' && lastTop && num(lastTop.w) > 0 ? lastTop.w : '';
  const n = Math.max(1, Math.min(12, +p.sets || 3));
  return {exId:p.exId, target: e.kind==='c' ? {min:+p.min||10} : {reps:+p.reps||10}, sets: Array.from({length:n}, ()=>newSet(e, prevW))};
}
function startWorkout(name, plan, routineId){
  const go_ = () => { S.active = {id:uid(), name, date:todayKey(), startedAt:Date.now(), routineId, items: plan.map(itemFromPlan)}; save(); go('train'); };
  if (S.active) confirmBox('Replace current workout?', `“${S.active.name}” is still in progress. Starting a new one discards it.`, 'Discard and start', go_, true); else go_();
}
function setRow(e, it, i, s, j){

    <td><input type="number" inputmode="decimal" min="0" step="0.01" data-set data-i="${i}" data-s="${j}" data-f="dist" value="${s.dist===''?'':round(toD(num(s.dist)),2)}" placeholder="–" aria-label="Distance"></td>

    <td><input type="number" inputmode="numeric" min="0" step="1" data-set data-i="${i}" data-s="${j}" data-f="r" value="${esc(s.r)}" placeholder="${tgt.reps||''}" aria-label="${e.kind==='t'?'Seconds':'Reps'}"></td>

}
function activeHtml(){

  </section>`;

function finishWorkout(){
  const A = S.active;
  const items = A.items.map(it => {
    const e = getEx(it.exId), tgt = it.target || {};
    let sets = it.sets.filter(s=>s.done);
    if (!sets.length) sets = it.sets.filter(s => e.kind==='c' ? num(s.min)>0 : num(s.r)>0);
    sets = sets.map(s => e.kind==='c' ? {min: num(s.min) || num(tgt.min), dist: num(s.dist)} : {w: num(s.w), r: num(s.r) || num(tgt.reps)});
    return {exId:it.exId, sets: sets.filter(s => e.kind==='c' ? s.min>0 : s.r>0)};
  }).filter(it=>it.sets.length);
  if (!items.length) { toast('Tick at least one set before finishing'); return; }
  const mins = Math.max(1, Math.min(300, Math.round((Date.now()-A.startedAt)/60000)));
  const draft = {name:A.name, date:A.date, items, durationMin:mins, ...(A.routineId ? {routineId:A.routineId} : {})};
  openModal(`<h3>Finish workout</h3>
    <div class="fields"><label class="field"><span>Duration (minutes)</span><input type="number" id="fin-min" min="1" max="600" value="${mins}"></label>
    <div class="field"><span>Estimated burn</span><strong class="num" id="fin-kcal" style="padding:8px 0">${workoutKcal(draft)} kcal</strong></div></div>
    <label class="field"><span>Notes</span><input type="text" id="fin-notes" placeholder="How did it feel?"></label>
    <div class="row end"><button class="btn ghost" data-act="close">Keep training</button><button class="btn primary" id="fin-ok">Save workout</button></div>`);
  $('#fin-min').oninput = ev => { draft.durationMin = num(ev.target.value); $('#fin-kcal').textContent = workoutKcal(draft) + ' kcal'; };
  $('#fin-ok').onclick = () => {
    draft.durationMin = Math.max(1, num($('#fin-min').value));
    const before = computeRecords();
    const w = {id:uid(), ...draft, notes: $('#fin-notes').value.trim(), endedAt: Date.now()};
    w.kcal = workoutKcal(w);
    S.workouts.push(w); S.active = null; save();
    const after = computeRecords(); const prs = [];
    for (const it of w.items) {
      const e = getEx(it.exId), a = after.get(it.exId), b = before.get(it.exId) || {};
      if (a.maxW && a.maxW.date===w.date && (!b.maxW || a.maxW.kg > b.maxW.kg + 1e-6)) prs.push(`${e.name}: heaviest ${fmtW(a.maxW.kg)} ${wu()} × ${a.maxW.reps}`);
      if (a.best1 && (!b.best1 || a.best1.kg > b.best1.kg + 1e-6) && !a.best1.manual) prs.push(`${e.name}: est. 1RM ${fmtW(a.best1.kg)} ${wu()}`);
      if (a.bestVol && (!b.bestVol || a.bestVol.kg > b.bestVol.kg + 1e-6) && b.bestVol) prs.push(`${e.name}: session volume ${fmtNum(toW(a.bestVol.kg))} ${wu()}`);
      if (e.kind==='t' && a.maxSec && (!b.maxSec || a.maxSec.sec > b.maxSec.sec)) prs.push(`${e.name}: longest hold ${a.maxSec.sec}s`);
    }
    openModal(`<h3>Workout saved</h3>
      <div class="stats"><div class="stat"><span class="label">Time</span><b class="num">${w.durationMin}<small>min</small></b></div><div class="stat"><span class="label">Volume</span><b class="num">${fmtNum(toW(workoutVolume(w)))}<small>${wu()}</small></b></div><div class="stat"><span class="label">Burn</span><b class="num">${w.kcal}<small>kcal</small></b></div></div>
      ${prs.length ? `<div><span class="label">New records</span>${prs.map(p=>`<div class="pr"><span class="badge">PR</span><span>${esc(p)}</span></div>`).join('')}</div>` : ''}
      <div class="row end"><button class="btn" data-act="save-as-routine" data-wid="${w.id}">Save as routine</button><button class="btn primary" data-act="close-today">Done</button></div>`);
    render();
  };
}

function exDetail(id){

const REC = {q:''};
function barChart(values, labels, unit, title){
  const W = 640, H = 220, L = 52, B = 26, T = 18, R = 8;
  const max = Math.max(...values, 0);
  const step = (() => { if (max <= 0) return 1; const raw = max/4, p = 10**Math.floor(Math.log10(raw)); return [1,2,2.5,5,10].map(m=>m*p).find(s=>s>=raw); })();
  const top = step*4, bw = (W-L-R)/values.length;
  let g = '';
  for (let i=0;i<=4;i++){ const v = step*i, y = H-B - (v/top)*(H-B-T); g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${fmtNum(v, v<10?1:0)}</text>`; }
  values.forEach((v,i)=>{ const h = (v/top)*(H-B-T), x = L + i*bw + bw*0.18, w = bw*0.64, y = H-B-h;
    g += `<rect class="bar ${i===values.length-1?'cur':''}" x="${x}" y="${y}" width="${w}" height="${Math.max(h, v>0?1:0)}" rx="2"/>`;
    if (v>0) g += `<text class="val" x="${x+w/2}" y="${y-5}" text-anchor="middle">${fmtNum(v, v<10?1:0)}</text>`;
    g += `<text x="${x+w/2}" y="${H-8}" text-anchor="middle">${labels[i]}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${g}</svg><span class="small muted">${esc(unit)}</span>`;
}

function makePack({name, routines = [], weeks = [], exercises = []}){

/* --- compact share codes: PL2.z.<base64url deflate> or PL2.j.<base64url json> --- */
function b64url(bytes){ let s = ''; for (let i=0;i<bytes.length;i+=0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function unb64url(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while (s.length % 4) s += '='; const bin = atob(s), out = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i); return out; }
async function pipeBytes(bytes, stream){ const buf = await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer(); return new Uint8Array(buf); }
async function encodePack(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  if (typeof CompressionStream === 'function') { try { return CODE_TAG + 'z.' + b64url(await pipeBytes(bytes, new CompressionStream('deflate-raw'))); } catch (e) {} }
  return CODE_TAG + 'j.' + b64url(bytes);
}
async function decodeCode(text){
  const m = /PL2\.([zj])\.([A-Za-z0-9_-]+)/.exec(text); if (!m) throw new Error('no code');
  let bytes = unb64url(m[2]);
  if (m[1] === 'z') { if (typeof DecompressionStream !== 'function') throw new Error('This browser can’t open compressed codes. Update it, or ask for the .json file.'); bytes = await pipeBytes(bytes, new DecompressionStream('deflate-raw')); }
  return JSON.parse(new TextDecoder().decode(bytes));
}
function siteUrl(){
  const set = (S.profile.shareUrl || '').trim();
  if (set) return set.split('#')[0];
  if (!inArtifact() && /^https?:$/.test(location.protocol)) return location.origin + location.pathname;
  return '';
}
const linkFor = code => { const base = siteUrl(); return base ? base + '#import=' + code : ''; };

/* --- files --- */
async function saveBlob(filename, data, mime){
  if (inArtifact()) {
    try { const dl = await window.claude.use('downloads'); if (dl) { await dl.save({filename, data}); return 'saved'; } }
    catch (err) { if (err && err.code === 'declined') return 'declined'; }
    return 'failed';
  }
  try {
    const blob = data instanceof Blob ? data : new Blob([data], {type: mime || 'application/json'});
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500); return 'saved';
  } catch (e) { return 'failed'; }
}
async function saveJson(filename, obj, isProfile){
  const text = JSON.stringify(obj, null, 2), res = await saveBlob(filename, text);
  if (res === 'saved') { if (isProfile) { S.lastExport = Date.now(); save(); if (tab==='profile') renderProfile(); } toast('Saved ' + filename); }
  else if (res === 'declined') toast('Save cancelled');
  else showTextFallback(filename, text, isProfile);
}
function showTextFallback(filename, text, isProfile){
  openModal(`<h3>Copy your file</h3><p class="small muted">This page can't save files here. Copy the text below into a file named <b>${esc(filename)}</b>.</p><textarea id="fb-text" readonly>${esc(text)}</textarea>
    <div class="row end"><button class="btn ghost" data-act="close">Close</button><button class="btn primary" id="fb-copy">Copy</button></div>`);
  $('#fb-copy').onclick = () => copyText(text, $('#fb-text'), () => { if (isProfile) { S.lastExport = Date.now(); save(); } });
}
function copyText(text, el, after){
  const fallback = () => { if (el) { el.focus(); el.select(); } toast('Press Ctrl+C or ⌘C to copy'); };
  try { navigator.clipboard.writeText(text).then(() => { toast('Copied'); after && after(); }, fallback); } catch (e) { fallback(); }
}

/* --- QR codes --- */
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load')); document.head.appendChild(s); }); }
const libs = {};
async function ensureLib(name, url){ if (window[name]) return true; try { libs[url] = libs[url] || loadScript(url); await libs[url]; return !!window[name]; } catch (e) { delete libs[url]; return false; } }
function makeQr(text){
  for (const ec of ['M','L']) { try { const q = window.qrcode(0, ec); q.addData(text); q.make(); return q; } catch (e) {} }
  return null;
}
function drawQr(q, canvas){
  const n = q.getModuleCount(), margin = 4, scale = Math.max(3, Math.floor(640 / (n + margin*2))), size = (n + margin*2) * scale;
  canvas.width = canvas.height = size; const c = canvas.getContext('2d');
  c.fillStyle = '#ffffff'; c.fillRect(0, 0, size, size); c.fillStyle = '#000000';
  for (let r=0;r<n;r++) for (let col=0;col<n;col++) if (q.isDark(r,col)) c.fillRect((col+margin)*scale, (r+margin)*scale, scale, scale);
}

/* --- importing --- */
function sameRoutine(a, b){ return a.name === b.name && (a.notes||'') === (b.notes||'') && JSON.stringify(a.items) === JSON.stringify(b.items); }
function mergeExercises(list, fallbackAuthor){
  const map = new Map(); let added = 0;
  for (const raw of (Array.isArray(list) ? list : [])) {
    if (!raw || typeof raw.name !== 'string') continue;
    if (typeof raw.id === 'string' && BASE_IDS.has(raw.id)) { map.set(raw.id, raw.id); continue; }
    const same = allEx().find(e => (typeof raw.id === 'string' && e.id === raw.id) || e.name.toLowerCase() === raw.name.trim().toLowerCase());
    if (same) { if (raw.id) map.set(raw.id, same.id); continue; }
    const c = cleanEx(raw, 'imported'); if (!c) continue;
    if (typeof raw.id === 'string' && raw.id && !raw.id.startsWith('b-') && !EXMAP.has(raw.id)) c.id = raw.id.slice(0,60);
    if (!c.author) c.author = fallbackAuthor;
    S.library.push(c); reindex(); if (raw.id) map.set(raw.id, c.id); added++;
  }
  return {map, added};
}
// Shared items keep their id. A newer copy with the same id updates yours; editing someone else's item makes a remix with a new id.
function upsert(list, item, same){
  const i = list.findIndex(x => x.id === item.id);
  if (i < 0) { if (list.some(x => x.name === item.name)) item.name = `${item.name} (${item.author.name})`.slice(0,60); list.push(item); return 'added'; }
  if (same(list[i], item)) return 'same';
  if (item.updatedAt > (list[i].updatedAt || 0)) { list[i] = item; return 'updated'; }
  return 'kept';
}
function importPack(obj){
  const fb = cleanAuthor(obj.author) || {id:'unknown', name:'Unknown'};
  const {map, added} = mergeExercises(obj.exercises, fb);
  const n = {added:0, updated:0, wAdded:0, wUpdated:0};
  for (const raw of (Array.isArray(obj.routines) ? obj.routines : [])) {
    const r = cleanRoutine(raw, fb); if (!r) continue;
    r.items = r.items.map(i => ({...i, exId: map.get(i.exId) || i.exId})).filter(i => EXMAP.has(i.exId));
    if (!r.items.length) continue;
    const res = upsert(S.routines, r, sameRoutine); if (res==='added') n.added++; if (res==='updated') n.updated++;
  }
  const touched = [];
  for (const raw of (Array.isArray(obj.weeks) ? obj.weeks : [])) {
    const w = cleanWeek(raw, fb); if (!w) continue;
    w.days = w.days.map(d => d.filter(e => e.kind !== 'routine' || S.routines.some(r => r.id === e.routineId)));
    const res = upsert(S.weeks, w, (a,b) => a.name===b.name && JSON.stringify(a.days)===JSON.stringify(b.days));
    if (res==='added') n.wAdded++; if (res==='updated') n.wUpdated++;
    touched.push(S.weeks.find(x => x.id === w.id));
  }
  save(); render();
  const parts = [];
  if (n.wAdded) parts.push(`${n.wAdded} week plan${n.wAdded===1?'':'s'}`);
  if (n.added) parts.push(`${n.added} routine${n.added===1?'':'s'}`);
  if (added) parts.push(`${added} exercise${added===1?'':'s'}`);
  const upd = n.updated + n.wUpdated;
  const msg = (parts.length ? 'Added ' + parts.join(', ') + (upd ? `, updated ${upd}` : '') : upd ? `Updated ${upd} item${upd===1?'':'s'}` : 'Nothing new to add') + (fb.id !== 'unknown' && !isMine(fb) ? ` from ${fb.name}` : '');
  toast(msg);
  if (touched.length) pickWeekTarget(touched[0]);
}
function importObject(obj){
  if (Array.isArray(obj)) { const {added} = mergeExercises(obj, {id:'unknown', name:'Unknown'}); save(); render(); toast(`Added ${added} exercise${added===1?'':'s'} to your library`); return; }
  if (!obj || typeof obj !== 'object') { toast('That doesn’t look like a Plateload file'); return; }
  const isProfile = obj.type === 'profile' || (obj.profile && Array.isArray(obj.workouts));
  if (isProfile) {
    const who = obj.profile && obj.profile.name ? `“${obj.profile.name}”` : 'this profile';
    const author = {id: obj.profile && obj.profile.authorId || 'unknown', name: obj.profile && obj.profile.name || 'Unknown'};
    openModal(`<h3>Load profile</h3><p>It has ${(obj.workouts||[]).length} workouts, ${(obj.runs||[]).length} runs, ${(obj.routines||[]).length} routines, ${(obj.weeks||[]).length} week plans and ${(obj.library||[]).length} custom exercises.</p>
      <p class="small muted">Replace swaps everything in this browser for ${esc(who)}; use it to move your own data to this device. Merge keeps your data and adds their exercises, routines and week plans.</p>
      <div class="row end"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" id="im-merge">Merge workouts</button><button class="btn danger" id="im-replace">Replace my data</button></div>`);
    $('#im-merge').onclick = () => { closeModal(); importPack({author, exercises:obj.library, routines:obj.routines, weeks:obj.weeks}); };
    $('#im-replace').onclick = () => { S = normalize(obj); S.active = null; S.lastExport = Date.now(); reindex(); save(); closeModal(); go('today'); toast('Profile loaded'); };
    return;
  }
  if (obj.routines || obj.exercises || obj.weeks) { importPack(obj); return; }
  toast('That doesn’t look like a Plateload file');
}
async function importText(text){
  text = String(text || '').trim(); if (!text) { toast('Nothing to import'); return; }
  if (text.includes(CODE_TAG)) { try { importObject(await decodeCode(text)); } catch (e) { toast(e && e.message && e.message.length > 20 ? e.message : 'That share code is damaged or incomplete'); } return; }
  let obj; try { obj = JSON.parse(text); } catch (e) { toast(/^https?:\/\//.test(text) ? 'That link has no Plateload share code in it. Use “Load from a link” for .json files.' : 'That isn’t a share code or valid JSON'); return; }
  importObject(obj);
}
function readFileInput(input, fn){ const f = input.files && input.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => fn(String(rd.result)); rd.onerror = () => toast('Couldn’t read that file'); rd.readAsText(f); input.value = ''; }
async function importFromUrl(url){
  url = url.trim(); if (!/^https?:\/\//.test(url)) { toast('Enter a link that starts with https://'); return; }
  if (url.includes(CODE_TAG)) { importText(url); return; }
  const gh = /^https:\/\/github\.com\/([^/]+)\/([^/]+)\/blob\/(.+)$/.exec(url);
  if (gh) url = `https://raw.githubusercontent.com/${gh[1]}/${gh[2]}/${gh[3]}`;
  try { const res = await fetch(url); if (!res.ok) throw new Error(res.status); importText(await res.text()); }
  catch (e) { toast(inArtifact() ? 'Links can’t be loaded in this preview. Use the GitHub Pages version, or download the file and load it.' : 'Couldn’t load that link. Check that it points to a public .json file.'); }
}

/* --- scanning --- */
const SCAN = {stream:null, raf:0};
function stopScan(){ cancelAnimationFrame(SCAN.raf); if (SCAN.stream) SCAN.stream.getTracks().forEach(t => t.stop()); SCAN.stream = null; }
async function detector(){
  if ('BarcodeDetector' in window) { try { const fm = await window.BarcodeDetector.getSupportedFormats(); if (fm.includes('qr_code')) { const d = new window.BarcodeDetector({formats:['qr_code']}); return async src => { const r = await d.detect(src); return r[0] ? r[0].rawValue : null; }; } } catch (e) {} }
  if (!(await ensureLib('jsQR', JSQR_URL))) return null;
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d', {willReadFrequently:true});
  return async src => { const w = src.videoWidth || src.width, h = src.videoHeight || src.height; if (!w || !h) return null;
    const k = Math.min(1, 1000 / Math.max(w, h)); cv.width = Math.round(w*k); cv.height = Math.round(h*k); ctx.drawImage(src, 0, 0, cv.width, cv.height);
    const r = window.jsQR(ctx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, {inversionAttempts:'attemptBoth'}); return r ? r.data : null; };
}
async function scanCamera(){
  openModal(`<h3>Scan a QR code</h3><video class="scan-video" id="scan-v" playsinline muted></video><p class="small muted" id="scan-msg">Starting camera…</p><div class="row end"><button class="btn ghost" data-act="close">Cancel</button></div>`);
  const detect = await detector();
  if (!detect) { $('#scan-msg').textContent = 'The QR reader needs an internet connection the first time. Try again once you’re online.'; return; }
  try { SCAN.stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}, audio:false}); }
  catch (e) { const m = $('#scan-msg'); if (m) m.textContent = 'The camera isn’t available here. Close this and use “Scan a photo” with a picture or screenshot of the code instead.'; return; }
  const v = $('#scan-v'); if (!v) { stopScan(); return; }
  v.srcObject = SCAN.stream; try { await v.play(); } catch (e) {}
  $('#scan-msg').textContent = 'Point the camera at a Plateload QR code.';
  let busy = false;
  const tick = async () => {
    if (!SCAN.stream) return;
    if (!busy && v.readyState >= 2) { busy = true; try { const data = await detect(v); if (data) { stopScan(); closeModal(); importText(data); return; } } catch (e) {} busy = false; }
    SCAN.raf = requestAnimationFrame(tick);
  };
  tick();
}
async function scanImage(input){
  const f = input.files && input.files[0]; input.value = ''; if (!f) return;
  const detect = await detector(); if (!detect) { toast('The QR reader needs an internet connection the first time'); return; }
  const url = URL.createObjectURL(f), img = new Image();
  img.onload = async () => { let data = null; try { data = await detect(img); } catch (e) {} URL.revokeObjectURL(url); data ? importText(data) : toast('No QR code found in that picture. Try a closer, sharper photo.'); };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Couldn’t open that picture'); };
  img.src = url;
}

function shareRoutine(r){ openShare(makePack({name:r.name, routines:[r]}), `plateload-routine-${fileSafe(r.name)}.json`); }
function shareWeek(w){ openShare(makePack({name:w.name, weeks:[w]}), `plateload-week-${fileSafe(w.name)}.json`); }
function shareThisWeek(){
  const p = getPlan(planWeek);
  if (!p.days.some(d => d.length)) { toast('Plan at least one day before sharing'); return; }
  const existing = p.savedId && S.weeks.find(w => w.id === p.savedId);
  const def = existing ? existing.name : (S.profile.name ? S.profile.name + '’s week' : weekLabel(planWeek));
  openModal(`<h3>Share this week</h3><p class="small muted">It's also saved to your week plans so you can reuse it. Sharing it again later sends the updated version.</p>

    <div class="row end"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" id="wk-ok">Share</button></div>`);
  $('#wk-ok').onclick = () => { const w = saveWeekFromPlan($('#wk-name').value.trim() || def, $('#wk-notes').value.trim()); shareWeek(w); };

function saveWeekFromPlan(name, notes){
  const p = ensurePlan(planWeek); let w = p.savedId && S.weeks.find(x => x.id === p.savedId && isMine(x.author));
  if (w) { w.name = name; w.notes = notes || w.notes || ''; w.days = JSON.parse(JSON.stringify(p.days)); w.updatedAt = Date.now(); }
  else { w = weekFromPlan(name); w.notes = notes || ''; S.weeks.unshift(w); p.savedId = w.id; }
  save(); return w;
}

  close: () => closeModal(),
  'close-today': () => { closeModal(); go('today'); },
  'start-empty': () => startWorkout('Workout', []),
  'start-routine': t => { const r = S.routines.find(x=>x.id===t.dataset.id); if (r) { closeModal(); startWorkout(r.name, r.items, r.id); } },
  'edit-routine': t => editRoutine(t.dataset.id),
  'new-routine': () => editRoutine(null),
  'share-routine': t => { const r = S.routines.find(x=>x.id===t.dataset.id); if (r) shareRoutine(r); },
  'share-all': () => { if (!S.routines.length) { toast('No routines to share yet'); return; } openShare(makePack({name: (S.profile.name ? S.profile.name + '’s routines' : 'My routines'), routines:S.routines}), 'plateload-routines.json'); },
  'del-routine': t => { const r = S.routines.find(x=>x.id===t.dataset.id); if (r) confirmBox('Delete routine?', `“${r.name}” will be removed. Workouts you logged from it stay in your history, and planned days that use it show as missing.`, 'Delete', () => { S.routines = S.routines.filter(x=>x!==r); save(); render(); }, true); },
  pick: t => openPicker(t.dataset.target),
  'pick-close': () => { if (PICK.target === 'edit' && EDIT) renderEditor(); else closeModal(); },
  'ed-mv': t => { const i = +t.dataset.i, j = i + +t.dataset.d, a = EDIT.items; if (j<0||j>=a.length) return; [a[i],a[j]] = [a[j],a[i]]; renderEditor(); },
  'ed-rm': t => { EDIT.items.splice(+t.dataset.i, 1); renderEditor(); },
  'ed-save': () => saveEditor(),
  'ed-share': () => { const r = S.routines.find(x=>x.id===EDIT.id); if (r) shareRoutine(r); },
  // planner
  'plan-nav': t => { const d = +t.dataset.d; planWeek = d ? addDays(planWeek, d) : weekStart(todayKey()); renderPlanner(); },
  'plan-add': t => planAdd(+t.dataset.d),
  'plan-pick': t => planPush(+t.dataset.d, {kind:'routine', routineId:t.dataset.id}),
  'plan-run': t => planPush(+t.dataset.d, {kind:'run', type:$('#pa-type').value, km: fromD(num($('#pa-km').value)), note:$('#pa-note').value.trim().slice(0,80)}),
  'plan-rest': t => { const p = ensurePlan(planWeek); p.days[+t.dataset.d] = [{kind:'rest', note:''}]; save(); closeModal(); renderPlanner(); },
  'plan-rm': t => { const p = ensurePlan(planWeek); p.days[+t.dataset.d].splice(+t.dataset.j, 1); save(); renderPlanner(); },
  'plan-copy': () => { const prev = S.plans[addDays(planWeek,-7)]; if (!prev || !prev.days.some(d=>d.length)) { toast('Nothing planned last week'); return; }
    const go_ = () => { S.plans[planWeek] = {days: JSON.parse(JSON.stringify(prev.days)), from: prev.from, savedId: prev.savedId}; save(); renderPlanner(); toast('Copied last week'); };
    getPlan(planWeek).days.some(d=>d.length) ? confirmBox('Replace this week?', 'This week already has a plan. Copying last week replaces it.', 'Replace', go_, true) : go_(); },
  'plan-clear': () => { if (!getPlan(planWeek).days.some(d=>d.length)) return; confirmBox('Clear this week?', 'All planned days for this week will be removed. Saved week plans are not affected.', 'Clear', () => { delete S.plans[planWeek]; save(); renderPlanner(); }, true); },
  'plan-save': () => { const p = getPlan(planWeek); if (!p.days.some(d=>d.length)) { toast('Plan at least one day first'); return; }
    const existing = p.savedId && S.weeks.find(w => w.id === p.savedId && isMine(w.author));
    openModal(`<h3>Save as week plan</h3><label class="field"><span>Plan name</span><input type="text" id="wk-name" maxlength="60" value="${esc(existing ? existing.name : (S.profile.name ? S.profile.name + '’s week' : weekLabel(planWeek)))}"></label>
      <label class="field"><span>Notes (optional)</span><input type="text" id="wk-notes" maxlength="200" value="${esc(existing ? existing.notes : '')}"></label>
      <div class="row end"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" id="wk-ok">${existing ? 'Update plan' : 'Save plan'}</button></div>`);
    $('#wk-ok').onclick = () => { const w = saveWeekFromPlan($('#wk-name').value.trim() || 'Week plan', $('#wk-notes').value.trim()); closeModal(); renderPlanner(); toast(`Saved “${w.name}”`); }; },
  'plan-share': () => shareThisWeek(),
  'week-apply': t => { const w = S.weeks.find(x=>x.id===t.dataset.id); if (w) applyWeek(w, planWeek); },
  'week-apply-to': t => { const w = S.weeks.find(x=>x.id===t.dataset.id); if (w) { closeModal(); applyWeek(w, t.dataset.ws); } },
  'share-week': t => { const w = S.weeks.find(x=>x.id===t.dataset.id); if (w) shareWeek(w); },
  'week-del': t => { const w = S.weeks.find(x=>x.id===t.dataset.id); if (w) confirmBox('Delete week plan?', `“${w.name}” will be removed from your saved plans. Weeks already on your calendar stay.`, 'Delete', () => { S.weeks = S.weeks.filter(x=>x!==w); save(); render(); }, true); },
  // sharing
  'sh-file': () => SHARE && saveJson(SHARE.filename, SHARE.pack, SHARE.isProfile),
  'sh-link': () => SHARE && copyText(SHARE.link),
  'sh-code': () => SHARE && copyText(SHARE.code),
  'sh-png': () => sharePng(),
  'share-profile': () => openShare(profileFile(), `plateload-${S.profile.name ? fileSafe(S.profile.name) : 'my'}-profile.json`),
  'share-ex': t => { const e = getEx(t.dataset.id); if (e && !e.builtin) openShare(makePack({name:e.name, exercises:[e]}), `plateload-exercise-${fileSafe(e.name)}.json`); },
  'scan-cam': () => scanCamera(),
  'paste-import': () => importText($('#paste-in').value),
  'url-import': () => importFromUrl($('#url-in').value),
  'sel-none': () => { SEL.w.clear(); SEL.r.clear(); SEL.e.clear(); renderShare(); },
  'pack-share': () => sharePack(),
  'pk-m': t => { PICK.m = PICK.m===t.dataset.m ? '' : t.dataset.m; renderPick(); },
  'pick-ex': t => addPicked(t.dataset.id),
  'add-set': t => { const it = S.active.items[+t.dataset.i], e = getEx(it.exId), last = it.sets.at(-1); const s = newSet(e, last ? last.w : ''); if (e.kind==='c' && last) { s.min = ''; } it.sets.push(s); save(); renderTrain(); },
  'rm-set': t => { const it = S.active.items[+t.dataset.i]; it.sets.splice(+t.dataset.s, 1); if (!it.sets.length) S.active.items.splice(+t.dataset.i, 1); save(); renderTrain(); },
  'rm-ex': t => { S.active.items.splice(+t.dataset.i, 1); save(); renderTrain(); },
  mv: t => { const i = +t.dataset.i, j = i + +t.dataset.d, a = S.active.items; if (j<0||j>=a.length) return; [a[i],a[j]] = [a[j],a[i]]; save(); renderTrain(); },
  discard: () => confirmBox('Discard workout?', 'Nothing from this session will be saved.', 'Discard', () => { S.active = null; save(); render(); }, true),
  finish: () => finishWorkout(),
  'g-muscle': t => { const m = t.dataset.m; GEN.groups.has(m) ? GEN.groups.delete(m) : GEN.groups.add(m); t.setAttribute('aria-pressed', GEN.groups.has(m)); },
  'g-equip': t => { const q = t.dataset.q; GEN.equip.has(q) ? GEN.equip.delete(q) : GEN.equip.add(q); t.setAttribute('aria-pressed', GEN.equip.has(q)); },
  'g-preset': t => { GEN.groups = new Set(PRESETS[t.dataset.p]); GEN.per = PRESETS[t.dataset.p].length > 3 ? 1 : 2; generate(); },
  'g-scheme': t => { GEN.scheme = t.dataset.k; GEN.result = GEN.result.map(r => genItem(getEx(r.exId))); renderTrain(); },
  'g-run': () => generate(),
  'g-reroll': t => rerollGen(+t.dataset.i),
  'g-rm': t => { GEN.result.splice(+t.dataset.i,1); renderTrain(); },
  'g-start': () => { const groups = routineMuscles(GEN.result).filter(m=>m!=='Cardio'); startWorkout(groups.slice(0,3).join(' + ') || 'Workout', GEN.result); },
  'g-save': () => askRoutineName(routineMuscles(GEN.result).slice(0,3).join(' + ') + ' Day', GEN.result.map(r=>({...r}))),
  'save-as-routine': t => { const w = S.workouts.find(x=>x.id===t.dataset.wid); if (!w) return;
    askRoutineName(w.name, w.items.map(it => { const e = getEx(it.exId); return e.kind==='c' ? {exId:it.exId, sets:1, min: it.sets[0].min} : {exId:it.exId, sets: it.sets.length, reps: Math.round(it.sets.reduce((a,s)=>a+s.r,0)/it.sets.length)}; })); },
  repeat: t => { const w = S.workouts.find(x=>x.id===t.dataset.id); if (!w) return;
    const go_ = () => { S.active = {id:uid(), name:w.name, date:todayKey(), startedAt:Date.now(), routineId:w.routineId, items: w.items.map(it => { const e = getEx(it.exId); return {exId:it.exId, target: e.kind==='c'?{min:it.sets[0].min}:{reps:it.sets[0].r}, sets: it.sets.map(s => e.kind==='c' ? {min:'', dist:'', done:false} : {w: s.w || '', r:'', done:false})}; })}; save(); go('train'); };
    if (S.active) confirmBox('Replace current workout?', `“${S.active.name}” is still in progress.`, 'Discard and start', go_, true); else go_(); },
  'del-w': t => confirmBox('Delete workout?', 'It will be removed from your history, streaks and records.', 'Delete', () => { S.workouts = S.workouts.filter(w=>w.id!==t.dataset.id); save(); render(); }, true),
  'del-r': t => confirmBox('Delete run?', 'It will be removed from your history and totals.', 'Delete', () => { S.runs = S.runs.filter(r=>r.id!==t.dataset.id); save(); render(); }, true),
  'ex-detail': t => exDetail(t.dataset.id),
  'ex-add': t => { closeModal(); const e = getEx(t.dataset.id); PICK.target = 'active';
    if (!S.active) { S.active = {id:uid(), name:e.name, date:todayKey(), startedAt:Date.now(), items:[]}; }
    addPicked(t.dataset.id); },
  'del-ex': t => { const e = getEx(t.dataset.id); const used = S.workouts.some(w=>w.items.some(i=>i.exId===e.id)) || S.routines.some(r=>r.items.some(i=>i.exId===e.id));
    confirmBox('Delete exercise?', used ? `“${e.name}” is used in your history or routines. Those entries will show as “Unknown exercise”.` : `“${e.name}” will be removed from your library.`, 'Delete', () => { S.library = S.library.filter(x=>x.id!==e.id); reindex(); save(); render(); }, true); },
  'new-ex': () => newExercise(),
  'nx-sec': t => t.setAttribute('aria-pressed', t.getAttribute('aria-pressed')!=='true'),
  'add-max': () => addMax(),
  'save-run': () => { const {km, sec, type} = runFormValues();
    if (!(km>0)) { toast('Enter the distance'); return; } if (!(sec>0)) { toast('Enter your time'); return; }
    S.runs.push({id:uid(), date:$('#rn-d').value || todayKey(), type, km, sec, notes:$('#rn-n').value.trim(), kcal:runKcal(km,sec,type), at:Date.now()}); save(); toast(`${type} saved · ${fmtPace(sec,km)}`); renderRunning(); },
  units: t => { S.profile.units = t.dataset.u; save(); render(); },
  dunits: t => { S.profile.distUnit = t.dataset.u; save(); render(); },
  'export-profile': () => saveJson(`plateload-${S.profile.name ? fileSafe(S.profile.name) : 'my'}-profile.json`, profileFile(), true),
  reset: () => confirmBox('Erase all data?', 'Your profile, history, records, custom exercises and routines in this browser will be deleted. This can’t be undone.', 'Erase everything', () => { S = fresh(); reindex(); save(); go('today'); toast('All data erased'); }, true),
};
function askRoutineName(def, items){
  if (!items.length) { toast('Add some exercises first'); return; }
  openModal(`<h3>Save as routine</h3><label class="field"><span>Routine name</span><input type="text" id="rt-name" maxlength="60" value="${esc(def)}"></label><div class="row end"><button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" id="rt-ok">Save routine</button></div>`);
  $('#rt-ok').onclick = () => { const name = $('#rt-name').value.trim() || def; S.routines.unshift({id:'r-'+uid(), name, notes:'', items: items.map(cleanItem).filter(Boolean), author: me(), createdAt:Date.now(), updatedAt:Date.now()}); save(); closeModal(); toast(`Saved “${name}”`); render(); };
}

/* ================= Routine editor ================= */
let EDIT = null;
function editRoutine(id){
  const r = id ? S.routines.find(x=>x.id===id) : null;
  if (id && !r) return;
  EDIT = r ? {id:r.id, name:r.name, notes:r.notes||'', items:r.items.map(i=>({...i}))} : {id:null, name:'New routine', notes:'', items:[]};
  renderEditor();
}
function renderEditor(){
  const r = EDIT.id && S.routines.find(x=>x.id===EDIT.id), other = r && !isMine(r.author);
  const rows = EDIT.items.map((it,i) => { const e = getEx(it.exId);
    const nums = e.kind==='c' ? `<input type="number" min="1" style="width:64px" data-ed data-i="${i}" data-f="min" value="${it.min||15}" aria-label="Minutes"><span class="small muted">min</span>`
      : `<input type="number" min="1" max="12" style="width:54px" data-ed data-i="${i}" data-f="sets" value="${it.sets}" aria-label="Sets"><span class="small muted">×</span><input type="number" min="1" style="width:60px" data-ed data-i="${i}" data-f="reps" value="${it.reps||10}" aria-label="${e.kind==='t'?'Seconds':'Reps'}">${e.kind==='t'?'<span class="small muted">s</span>':''}`;
    return `<div class="item"><div class="main"><span class="name">${esc(e.name)}</span><div class="tags">${mTag(e.muscle)}<span class="tag">${esc(e.equipment)}</span></div></div>
      <div class="acts">${nums}<button class="icon-btn" data-act="ed-mv" data-i="${i}" data-d="-1" aria-label="Move up">↑</button><button class="icon-btn" data-act="ed-mv" data-i="${i}" data-d="1" aria-label="Move down">↓</button><button class="icon-btn" data-act="ed-rm" data-i="${i}" aria-label="Remove">×</button></div></div>`; }).join('');
  openModal(`<h3>${r ? 'Edit routine' : 'New routine'}</h3>${r ? byLine(r) : ''}
    ${other ? `<p class="note">This routine is by ${esc(r.author.name)}. Saving changes makes your own remix that credits them. Their original stays in your library and still gets their updates.</p>` : ''}
    <label class="field"><span>Name</span><input type="text" id="ed-name" maxlength="60" value="${esc(EDIT.name)}"></label>
    <label class="field"><span>Notes</span><input type="text" id="ed-notes" maxlength="500" value="${esc(EDIT.notes)}" placeholder="Rest 2 min between heavy sets"></label>
    <div class="list">${rows || '<p class="small muted">No exercises yet.</p>'}</div>
    <div><button class="btn sm" data-act="pick" data-target="edit">+ Add exercise</button></div>
    <div class="row between">${r ? `<button class="btn danger sm" data-act="del-routine" data-id="${esc(r.id)}">Delete</button>` : '<span></span>'}
      <div class="row">${r ? '<button class="btn" data-act="ed-share">Share</button>' : ''}<button class="btn ghost" data-act="close">Cancel</button><button class="btn primary" data-act="ed-save">${other ? 'Save as my remix' : 'Save'}</button></div></div>`);
}
function saveEditor(){
  const name = EDIT.name.trim() || 'Routine', items = EDIT.items.map(cleanItem).filter(Boolean), now = Date.now();
  if (!items.length) { toast('Add at least one exercise'); return; }
  const r = EDIT.id && S.routines.find(x=>x.id===EDIT.id);
  if (r && sameRoutine(r, {name, notes:EDIT.notes.trim(), items})) { closeModal(); return; }
  if (r && isMine(r.author)) { Object.assign(r, {name, notes:EDIT.notes.trim(), items, updatedAt:now}); toast('Routine saved'); }
  else if (r) { S.routines.unshift({id:'r-'+uid(), name: name === r.name && !/\(remix\)$/.test(name) ? name + ' (remix)' : name, notes:EDIT.notes.trim(), items, author:me(), basedOn:{name:r.name, author:r.author.name}, createdAt:now, updatedAt:now}); toast('Saved as your remix'); }
  else { S.routines.unshift({id:'r-'+uid(), name, notes:EDIT.notes.trim(), items, author:me(), createdAt:now, updatedAt:now}); toast(`Saved “${name}”`); }
  EDIT = null; save(); closeModal(); render();
}
document.addEventListener('click', e => {
  if (e.target.id === 'modal') { closeModal(); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const f = ACT[t.dataset.act]; if (f) { e.preventDefault(); f(t, e); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-set]')) { const s = S.active.items[+t.dataset.i].sets[+t.dataset.s], f = t.dataset.f;
    if (t.value === '') s[f] = ''; else s[f] = f==='w' ? fromW(num(t.value)) : f==='dist' ? fromD(num(t.value)) : num(t.value); save(); }
  else if (t.matches('[data-gen]')) { const r = GEN.result[+t.dataset.i]; if (r) r[t.dataset.f] = Math.max(1, num(t.value)|0); }
  else if (t.matches('[data-ed]')) { const r = EDIT && EDIT.items[+t.dataset.i]; if (r) r[t.dataset.f] = Math.max(1, t.dataset.f==='min' ? num(t.value) : num(t.value)|0); }
  else if (t.id === 'ed-name' && EDIT) EDIT.name = t.value;
  else if (t.id === 'ed-notes' && EDIT) EDIT.notes = t.value;
  else if (t.id === 'pk-q') { PICK.q = t.value; renderPick(); }
  else if (t.id === 'lib-q') { LIB.q = t.value; renderLibList(); }
  else if (t.id === 'rec-q') { REC.q = t.value; renderRecTable(); }
  else if (t.id === 'act-name') { S.active.name = t.value; save(); }
  else if (/^rn-(km|h|m|s)$/.test(t.id)) updateRunPreview();
  else if (t.matches('[data-prof="name"]')) onProf(t);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-done]')) { const it = S.active.items[+t.dataset.i], s = it.sets[+t.dataset.s], ex = getEx(it.exId); s.done = t.checked;
    if (t.checked) { if (ex.kind==='c') { if (s.min==='') s.min = it.target?.min || ''; } else if (s.r==='') s.r = it.target?.reps || ''; }
    save(); renderTrain(); }
  else if (t.matches('[data-prof]') && t.dataset.prof !== 'name') { onProf(t); if (tab==='profile' && ['sex','goal'].includes(t.dataset.prof)) renderProfile(); else if (tab==='share' && t.dataset.prof==='shareUrl') renderShare(); else renderSaveState(); }
  else if (t.matches('[data-sel]')) { SEL[t.dataset.sel][t.checked ? 'add' : 'delete'](t.value); const c = $('#sel-count'); if (c) c.textContent = (SEL.w.size + SEL.r.size + SEL.e.size) + ' selected'; }
  else if (t.matches('[data-scan-img]')) scanImage(t);
  else if (t.id === 'cal-date') { calDate = t.value || todayKey(); renderToday(); }
  else if (t.id === 'act-date') { S.active.date = t.value || todayKey(); save(); }
  else if (t.id === 'g-per') GEN.per = +t.value;
  else if (t.id === 'rn-t') updateRunPreview();
  else if (['lib-m','lib-e','lib-c','lib-p'].includes(t.id)) { LIB[{'lib-m':'m','lib-e':'q2','lib-c':'c','lib-p':'p'}[t.id]] = t.value; renderLibList(); }
  else if (t.matches('[data-import]')) readFileInput(t, importText);
});
setInterval(() => { const el = $('#elapsed'); if (el && S.active) el.textContent = Math.max(1, Math.round((Date.now()-S.active.startedAt)/60000)) + ' min'; }, 20000);
// Open the Train tab with a ready-made suggestion instead of an empty builder.
(function seedSuggestion(){
  const used = new Set();
  for (const g of MUSCLES.filter(m=>GEN.groups.has(m))) {
    const pool = poolFor(g), c = shuffle(pool.filter(e=>e.compound)), i = shuffle(pool.filter(e=>!e.compound));
    [c[0], i[0]].filter(Boolean).forEach(e => { if (!used.has(e.id)) { used.add(e.id); GEN.result.push(genItem(e)); } });
  }
})();
render();
// Opening a share link (…/#import=PL2.…) imports it straight away.
try {
  const h = location.hash;
  if (h.startsWith('#import=')) { const code = decodeURIComponent(h.slice(8)); history.replaceState(null, '', location.pathname + location.search); importText(code); }
} catch (e) {}
</script>
</body>
</html>
